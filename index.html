<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      width: 100%;
      max-width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 16px;
      padding: 20px 24px 16px;
      margin-bottom: 20px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    .expression {
      color: #a9b8cc;
      font-size: 14px;
      min-height: 20px;
      word-break: break-all;
      text-align: right;
    }

    .result {
      color: #e2e8f0;
      font-size: 42px;
      font-weight: 300;
      line-height: 1.1;
      word-break: break-all;
      text-align: right;
      transition: font-size 0.1s;
    }

    .result.small { font-size: 28px; }
    .result.xsmall { font-size: 20px; }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 500;
      height: 64px;
      cursor: pointer;
      transition: transform 0.08s, filter 0.08s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    @media (hover: hover) {
      button:hover { filter: brightness(1.15); }
    }

    button:active {
      transform: scale(0.93);
      filter: brightness(0.85);
    }

    .history { margin-top: 20px; }

    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .history h2 {
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
    }

    .history button {
      height: auto;
      font-size: 14px;
      font-weight: 400;
      border-radius: 8px;
      padding: 6px 10px;
      background: transparent;
      color: #cbd5e1;
    }

    .history ol {
      list-style: none;
      max-height: 124px;
      overflow-y: auto;
    }

    .history li button {
      display: block;
      width: 100%;
      text-align: right;
      word-break: break-all;
    }

    .history li button:focus-visible { outline-offset: -3px; }

    .history-empty {
      color: #a9b8cc;
      font-size: 14px;
      padding: 6px 0;
    }

    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* Function buttons (AC, +/-, %) */
    .btn-fn {
      background: #334155;
      color: #cbd5e1;
    }

    /* Operator buttons */
    .btn-op {
      background: #c2410c;
      color: #fff;
    }

    /* Number buttons */
    .btn-num {
      background: #1e3a5f;
      color: #e2e8f0;
    }

    /* Equals */
    .btn-eq {
      background: #c2410c;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-fn" data-action="clear" aria-label="All clear">AC</button>
      <button class="btn-fn" data-action="sign" aria-label="Toggle sign">+/−</button>
      <button class="btn-fn" data-action="percent" aria-label="Percent">%</button>
      <button class="btn-op" data-action="op" data-op="÷" aria-label="Divide">÷</button>

      <button class="btn-num" data-action="num" data-val="7">7</button>
      <button class="btn-num" data-action="num" data-val="8">8</button>
      <button class="btn-num" data-action="num" data-val="9">9</button>
      <button class="btn-op" data-action="op" data-op="×" aria-label="Multiply">×</button>

      <button class="btn-num" data-action="num" data-val="4">4</button>
      <button class="btn-num" data-action="num" data-val="5">5</button>
      <button class="btn-num" data-action="num" data-val="6">6</button>
      <button class="btn-op" data-action="op" data-op="−" aria-label="Subtract">−</button>

      <button class="btn-num" data-action="num" data-val="1">1</button>
      <button class="btn-num" data-action="num" data-val="2">2</button>
      <button class="btn-num" data-action="num" data-val="3">3</button>
      <button class="btn-op" data-action="op" data-op="+" aria-label="Add">+</button>

      <button class="btn-num" data-action="num" data-val="0">0</button>
      <button class="btn-num" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="btn-fn" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="btn-eq btn-op" data-action="equals" aria-label="Equals">=</button>
    </div>
    <section class="history" aria-labelledby="history-title">
      <div class="history-head">
        <h2 id="history-title">History</h2>
        <button id="history-clear" hidden>Clear</button>
      </div>
      <p class="history-empty" id="history-empty">No calculations yet</p>
      <ol id="history-list"></ol>
    </section>
    <div class="sr-only" id="announce" role="status"></div>
  </main>

  <script src="calculator.js"></script>
  <script>
    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');
    const announceEl = document.getElementById('announce');
    const calc = createCalculator();

    function render() {
      const text = calc.display;
      resultEl.textContent = text;
      expressionEl.textContent = calc.expression;
      resultEl.className = 'result' + (text.length > 12 ? ' xsmall' : text.length > 9 ? ' small' : '');
    }

    // Screen readers hear the result, not each digit.
    function announce() {
      announceEl.textContent = calc.expression + ' ' + calc.display;
    }

    function act(action, arg) {
      const hadError = calc.error;
      const entry = calc[action](arg);
      render();
      if (action === 'equals' && entry) addHistory(entry);
      if (action === 'equals' || calc.error !== hadError) announce();
    }

    // History: newest first, kept in this browser.
    const HISTORY_KEY = 'calculator-history';
    const HISTORY_MAX = 20;
    const historyList = document.getElementById('history-list');
    const historyEmpty = document.getElementById('history-empty');
    const historyClear = document.getElementById('history-clear');
    let history = loadHistory();

    function loadHistory() {
      try {
        const data = JSON.parse(localStorage.getItem(HISTORY_KEY));
        if (!Array.isArray(data)) return [];
        return data
          .filter(h => h && typeof h.expression === 'string' && typeof h.result === 'string')
          .slice(0, HISTORY_MAX);
      } catch { return []; }
    }

    function saveHistory() {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
    }

    function renderHistory() {
      historyList.replaceChildren(...history.map(h => {
        const btn = document.createElement('button');
        btn.textContent = h.expression + ' ' + h.result;
        btn.dataset.result = h.result;
        btn.setAttribute('aria-label', 'Use result ' + h.result + ' from ' + h.expression.replace(/ =$/, ''));
        const li = document.createElement('li');
        li.append(btn);
        return li;
      }));
      historyEmpty.hidden = history.length > 0;
      historyClear.hidden = history.length === 0;
    }

    function addHistory(entry) {
      history = [entry, ...history].slice(0, HISTORY_MAX);
      saveHistory();
      renderHistory();
      historyList.scrollTop = 0;
    }

    historyList.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (btn) act('recall', btn.dataset.result);
    });

    historyClear.addEventListener('click', () => {
      history = [];
      saveHistory();
      renderHistory();
    });

    const BUTTON_ACTIONS = {
      num: 'inputDigit', decimal: 'inputDecimal', op: 'inputOperator', equals: 'equals',
      clear: 'clear', sign: 'toggleSign', percent: 'percent', backspace: 'backspace',
    };

    document.querySelector('.buttons').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const { action, val, op } = btn.dataset;
      act(BUTTON_ACTIONS[action], val || op);
    });

    // After Tab, Enter must operate the button that has focus. After a pointer
    // click, the button keeps focus but Enter must give the result.
    let tabNavigation = false;
    document.addEventListener('pointerdown', () => { tabNavigation = false; });

    const KEY_OPERATORS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const key = e.key;
      if (key === 'Tab') { tabNavigation = true; return; }
      if (key === 'Enter' && tabNavigation && e.target.closest('button')) return;

      if (key >= '0' && key <= '9' && key.length === 1) act('inputDigit', key);
      else if (key === '.') act('inputDecimal');
      else if (key in KEY_OPERATORS) act('inputOperator', KEY_OPERATORS[key]);
      else if (key === 'Enter' || key === '=') act('equals');
      else if (key === 'Escape') act('clear');
      else if (key === 'Backspace') act('backspace');
      else if (key === '%') act('percent');
      else return;
      e.preventDefault();
    });

    render();
    renderHistory();
  </script>
</body>
</html>
